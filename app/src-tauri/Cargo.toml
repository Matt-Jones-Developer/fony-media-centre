[package]
name = "fony-media-centre"
version = "0.1.0"
description = "Fony Media Centre"
authors = ["Glitchy"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fony_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# "bundled" compiles SQLite into the app, so it doesn't depend on the Mac's copy.
rusqlite = { version = "0.43", features = ["bundled"] }
regex = "1.13.2"
serde_norway = "0.9.42"
notify = "9"
# Blocking HTTP for TMDB; runs on a background thread like ffprobe.
ureq = { version = "3.5", features = ["json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
