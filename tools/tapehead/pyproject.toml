[project]
name = "tapehead"
version = "0.1.0"
description = "Tidy up TV and cartoon episode filenames for Movie Centre"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "rapidfuzz>=3",
]

[project.scripts]
tapehead = "tapehead.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tapehead"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
