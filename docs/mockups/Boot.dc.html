<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Power-on screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=VT323&amp;family=Alfa+Slab+One&amp;family=Inter:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
</style>
</helmet>
<div style="width: 960px; height: 720px; position: relative; overflow: hidden; border-radius: 40px / 48px; background: radial-gradient(ellipse at 50% 45%, #13204a 0%, #080d20 60%, #03050c 100%)">
  <div style="position: absolute; left: 70px; top: 50px; font-family: VT323, monospace; font-size: 60px; color: #5dff6a; text-shadow: 3px 3px 0 #000">AV1</div>
  <div style="position: absolute; right: 70px; top: 50px; font-family: VT323, monospace; font-size: 60px; color: #f2f2f2; text-shadow: 3px 3px 0 #000">12:00</div>

  <div style="position: absolute; left: 0; right: 0; top: 230px; display: flex; flex-direction: column; align-items: center; gap: 18px">
    <div style="font-family: 'Alfa Slab One', serif; font-size: 120px; line-height: 1; letter-spacing: 22px; transform: scaleX(1.18); color: #f4f4f4; text-shadow: 0 0 30px rgba(170,195,255,0.45)">FONY</div>
    <div style="font-family: Inter, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 14px; color: #c9d2ee">MEDIA CENTRE</div>
  </div>

  <div class="blink" style="position: absolute; left: 0; right: 0; top: 540px; text-align: center; font-family: VT323, monospace; font-size: 48px; color: #f2f2f2; text-shadow: 3px 3px 0 #000">INSERT TAPE</div>
  <div style="position: absolute; left: 0; right: 0; top: 618px; text-align: center; font-family: VT323, monospace; font-size: 28px; color: #9aa6c8; text-shadow: 2px 2px 0 #000">DRIVE GLITCHY_2TB FOUND</div>

  <!-- CRT layers -->
  <div style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(90deg, rgba(255,0,0,0.05) 0 1px, rgba(0,255,0,0.05) 1px 2px, rgba(0,80,255,0.05) 2px 3px)"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,0.3) 0 2px, transparent 2px 4px)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 240px; height: 1px; background: rgba(0,0,0,0.35); pointer-events: none"></div>
  <div style="position: absolute; left: 0; right: 0; top: 480px; height: 1px; background: rgba(0,0,0,0.35); pointer-events: none"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%)"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(118deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.02) 28%, transparent 29%)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
